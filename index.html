<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visitor@portfolio: ~ (zsh)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' style='background:%230d0d0d;border-radius:16px'><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='52' font-family='monospace' font-weight='bold' fill='%234be277'>&gt;_</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.16.29/font/lucide.min.css">
</head>
<body>
    <!-- Tagline -->
    <div class="tagline-container">
        <p class="tagline">This is <span class="highlight">not</span> your <span class="highlight">average</span> portfolio.<span class="cursor">_</span></p>
    </div>

    <!-- Mini Music Player -->
    <div class="mini-player" id="mini-player">
        <button class="mini-play-btn" id="mini-play-btn" aria-label="Play music">
            <svg class="mini-icon mini-icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
            <svg class="mini-icon mini-icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <span class="mini-player-label" id="mini-player-label">enjoy with music</span>
        <canvas class="mini-visualizer" id="mini-visualizer" width="120" height="24"></canvas>
    </div>

    <!-- Terminal -->
    <main class="terminal-container">
        <!-- Terminal top bar -->
        <header class="terminal-header">
            <div class="window-controls">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <div class="terminal-title">visitor@portfolio: ~ (zsh)</div>
            <div class="terminal-icons">
                <i data-lucide="terminal"></i>
                <svg class="theme-toggle" id="theme-toggle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
            </div>
        </header>

        <!-- Terminal content -->
        <div class="terminal-content" id="terminal-output">
            <!-- Output will be dynamically added here -->
        </div>

        <!-- Input line -->
        <div class="terminal-input-line">
            <span class="prompt">visitor@miftah:~$</span>
            <div class="input-wrapper">
                <input type="text" id="terminal-input" class="terminal-input" autocomplete="off" spellcheck="false">
                <span class="input-mirror" id="input-mirror" aria-hidden="true"></span>
                <span class="inline-suggest" id="inline-suggest"></span>
                <div class="suggestions" id="suggestions"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-made-by">
            <span class="footer-label">MADE BY</span>
            <div class="footer-pill" id="footer-pill">
                <!-- Will be populated from data.json -->
            </div>
        </div>
        <div class="footer-copyright">
            © 2026 TERMINAL_OS v1.0.0. Built with Logic.
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="main.js"></script>
</body>
</html>
